<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Hello World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            color: #fff;
        }

        #canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 2;
            pointer-events: none;
            user-select: none;
        }

        .glitch-title {
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: #0ff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
            margin: 0;
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        .subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes glitch-anim {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 2px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -2px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(2px, -2px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(-2px, 2px); }
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h1 class="glitch-title">PROJECT // HELLO_WORLD</h1>
        <div class="subtitle">STATUS: ONLINE | INTERACTION: ENABLED (HOVER)</div>
    </div>
    <div class="scanlines"></div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particleArray = [];
        const mouse = { x: null, y: null, radius: 120 };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        window.addEventListener('touchmove', function(event) {
            mouse.x = event.touches[0].clientX;
            mouse.y = event.touches[0].clientY;
        });
        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        // Cyberpunk / Neon color palette
        const colors = ['#ff007f', '#00f3ff', '#7b00ff', '#ffffff'];

        class Particle {
            constructor(x, y) {
                this.baseX = x;
                this.baseY = y;
                // Start scattered across the screen for an intro assembly effect
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 1;
                this.density = (Math.random() * 30) + 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.angle = Math.random() * 360;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;
                
                // Mouse repulsion
                if (distance < mouse.radius && mouse.x != null) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    // Elastic return to base position
                    this.x += (this.baseX - this.x) * 0.05;
                    this.y += (this.baseY - this.y) * 0.05;
                }
                
                // Subtle floating wave effect
                this.angle += 0.05;
                this.baseX += Math.sin(this.angle) * 0.1;
                this.baseY += Math.cos(this.angle) * 0.1;
            }
        }

        function init() {
            particleArray = [];
            
            // Render text on an offscreen canvas to sample its pixels
            const textCanvas = document.createElement('canvas');
            const tCtx = textCanvas.getContext('2d', { willReadFrequently: true });
            textCanvas.width = window.innerWidth;
            textCanvas.height = window.innerHeight;
            
            let fontSize = Math.min(window.innerWidth / 7, window.innerHeight / 4);
            tCtx.fillStyle = 'white';
            tCtx.font = `900 ${fontSize}px "Orbitron", "Arial Black", sans-serif`;
            tCtx.textAlign = 'center';
            tCtx.textBaseline = 'middle';
            tCtx.fillText('HELLO WORLD', textCanvas.width / 2, textCanvas.height / 2);

            const textCoordinates = tCtx.getImageData(0, 0, textCanvas.width, textCanvas.height);
            
            // Dynamic resolution scaling for performance
            let step = Math.max(4, Math.floor(window.innerWidth / 350)); 
            
            for (let y = 0, y2 = textCoordinates.height; y < y2; y += step) {
                for (let x = 0, x2 = textCoordinates.width; x < x2; x += step) {
                    if (textCoordinates.data[(y * 4 * textCoordinates.width) + (x * 4) + 3] > 128) {
                        particleArray.push(new Particle(x, y));
                    }
                }
            }
        }

        init();

        function animate() {
            // Motion blur / trail effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particleArray.length; i++) {
                particleArray[i].draw();
                particleArray[i].update();
            }
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });
    </script>
</body>
</html>
